<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="onlyoffice-container"></div>
  </body>
  <script>
    async function loadOnlyOffice(fileId) {
      // 1. 获取 Token
      const resp = await fetch(
        `http://localhost:3005/onlyoffice/login`,
        {
            password: "123456",
            username: "admin"
        }
      );
      const { token } = await resp.json();

      // 2. 生成预览 URL
      const onlyofficeUrl = `http://localhost:8080/doceditor?fileUrl=http://localhost:3005//attachment/download/${fileId}`;

      // 3. 嵌入 iframe
      const iframe = document.createElement("iframe");
      iframe.src = onlyofficeUrl;
      iframe.width = "100%";
      iframe.height = "800px";
      iframe.frameBorder = "0";

      // 4. ONLYOFFICE 需要通过 postMessage 传 token
      iframe.onload = () => {
        iframe.contentWindow.postMessage(
          {
            type: "jwt",
            token: token,
          },
          'http://localhost:8080'
        );
      };

      document.getElementById("onlyoffice-container").appendChild(iframe);
    }

    // 调用
    loadOnlyOffice("mf0qiosemmd5i3995bh");
  </script>
</html>
